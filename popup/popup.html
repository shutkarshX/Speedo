<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPEEDO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="shell" data-ui>
    <!-- Topbar -->
    <header class="topbar">
      <div class="brand">
        <h1 class="brand-title">SPEEDO</h1>
        <span class="brand-ver">v2.4</span>
      </div>
      <div id="platformBadge" class="pill pill-platform">Detecting</div>
    </header>

    <!-- Beacon Status Bar -->
    <div class="beacon-bar">
      <div class="beacon-left">
        <span id="statusDot" class="beacon-dot"></span>
        <span id="statusBadge" class="beacon-status">Ready</span>
      </div>
      <span class="beacon-cue">Autonomous</span>
    </div>

    <!-- Actions Stack -->
    <div class="action-stack">
      <button id="btnStart" class="btn btn-hero">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <span>Start Automation</span>
      </button>

      <button id="btnStop" class="btn btn-destructive" disabled>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        </svg>
        <span>Halt</span>
      </button>
    </div>

    <!-- Settings Drawer (Optional AI Solver) -->
    <details class="settings-drawer">
      <summary class="settings-summary">AI Solver Settings</summary>
      <div class="settings-body">
        <div class="settings-hint">
          Auto AI: Keep <strong class="text-accent">gemini.google.com</strong> open in any tab. SPEEDO solves questions for free with zero setup.
        </div>
        <button id="btnOpenGeminiTab" class="btn-sm btn-outline">Launch Gemini Tab</button>
        <div class="settings-divider"></div>
        <label for="apiKeyInput" class="settings-label">Headless API Key (Optional)</label>
        <div class="settings-input-row">
          <input id="apiKeyInput" type="password" placeholder="AIzaSy..." class="input-text" autocomplete="off">
          <button id="btnSaveKey" class="btn-sm">Save</button>
        </div>
      </div>
    </details>

    <!-- Stream Terminal Panel -->
    <section class="stream-panel">
      <div class="stream-header">
        <span class="stream-label">Console</span>
      </div>
      <div id="logOutput" class="stream-body">
        <div class="stream-row text-muted">Ready for execution.</div>
      </div>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
